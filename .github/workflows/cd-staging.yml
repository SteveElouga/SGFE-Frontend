name: Deploy → Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sgfe-frontend

jobs:
  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-,format=short
            type=raw,value=staging-latest

      # Étape ajoutée (docs/CONFORMITE_CICD.md, item 1 / OWASP CICD-SEC-9) :
      # même raisonnement que cd-canary.yml — construire localement (load:
      # true, push: false, même scope de cache GHA que l'étape « Build &
      # push » plus bas) pour scanner CETTE image avant qu'elle n'atteigne
      # GHCR.
      - name: Build image (scan avant publication)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: sgfe-frontend:staging-${{ github.sha }}

      # Même bloc que ci.yml (job docker-build, lignes 138-145) : une CVE
      # CRITICAL/HIGH fait échouer ce job AVANT le push ci-dessous — donc
      # avant que l'image n'atteigne GHCR ni ne soit déployée en staging.
      - name: Scanner l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sgfe-frontend:staging-${{ github.sha }}
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true

      # Repousse le même contexte de build à travers le cache GHA déjà chaud
      # (cache-from/to identiques à l'étape précédente) : ce second appel ne
      # reconstruit pas les couches, il les publie. `sbom`/`provenance` ne
      # peuvent pas être attachés à une image seulement `load: true` (pas de
      # manifeste de registre) — c'est pourquoi ils sont posés ici et pas sur
      # l'étape de scan ci-dessus.
      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: ${{ vars.ENV_STAGING || 'staging' }}
      url: ${{ vars.STAGING_URL || 'https://staging.aquabill.cm' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/staging

            # Mettre à jour l'image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
            docker compose pull frontend
            docker compose up -d --no-deps frontend

            # Health check
            sleep 10
            curl -sf http://localhost/health || (docker compose logs frontend --tail=50 && exit 1)

            echo "✅ Staging déployé — ${{ needs.build-push.outputs.image-tag }}"

      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" ${{ secrets.STAGING_URL }}/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test échoué (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Smoke test OK"
