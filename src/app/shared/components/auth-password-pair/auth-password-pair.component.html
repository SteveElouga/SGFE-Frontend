<app-auth-field [label]="newPasswordLabel()">
  <p-password
    [inputId]="newPasswordId()"
    placeholder="••••••••"
    [feedback]="true"
    [toggleMask]="true"
    [fluid]="true"
    autocomplete="new-password"
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
    name="newPassword"
  />
</app-auth-field>

<app-auth-field [label]="confirmPasswordLabel()">
  <p-password
    [inputId]="confirmPasswordId()"
    placeholder="••••••••"
    [feedback]="false"
    [toggleMask]="true"
    [fluid]="true"
    autocomplete="new-password"
    [invalid]="!passwordsMatch()"
    [ngModel]="confirmPassword()"
    (ngModelChange)="confirmPassword.set($event)"
    name="confirmPassword"
  />
  @if (!passwordsMatch()) {
    <span class="auth-screen__hint auth-screen__hint--error">
      Les mots de passe ne correspondent pas
    </span>
  }
</app-auth-field>
