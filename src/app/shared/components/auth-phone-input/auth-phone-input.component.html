<div
  class="auth-phone-field"
  [class.auth-phone-field--valid]="isValid()"
  [class.auth-phone-field--invalid]="showError()"
>
  <span class="auth-phone-field__prefix">+237</span>
  <input
    [id]="inputId()"
    type="tel"
    pInputText
    [fluid]="true"
    autocomplete="tel"
    placeholder="612345678"
    [attr.aria-label]="'SET_PASSWORD.CHAMP_TEL' | translate"
    inputmode="numeric"
    maxlength="9"
    [invalid]="showError()"
    [ngModel]="value()"
    (ngModelChange)="value.set($event)"
    [name]="name()"
  />
</div>
@if (showError()) {
  <span class="auth-screen__hint auth-screen__hint--error" role="status" aria-live="polite">
    {{ 'AUTH.TEL_FORMAT' | translate }}
  </span>
}
