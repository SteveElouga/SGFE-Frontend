name: Deploy → Production (Canary)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Ne jamais annuler un déploiement prod en cours

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sgfe-frontend

jobs:
  # ── 1. Build & Push ──────────────────────────────────────────────────────────
  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      full-image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=canary

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Canary phase 1 : 5 % du trafic ───────────────────────────────────────
  canary-5pct:
    name: "Canary — 5%"
    runs-on: ubuntu-latest
    needs: build-push
    environment: production-canary   # Protection : aucun reviewer requis

    steps:
      - name: Deploy canary container (5%)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/production

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Démarrer le container canary avec la nouvelle image
            export CANARY_IMAGE="${{ needs.build-push.outputs.full-image }}"
            docker compose -f docker-compose.prod.yml pull frontend-canary
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend-canary

            # Appliquer la config nginx LB : stable=95 canary=5
            export CANARY_WEIGHT=5
            export STABLE_WEIGHT=95
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload

            sleep 10
            curl -sf http://localhost/health || exit 1
            echo "✅ Canary 5% actif — ${{ needs.build-push.outputs.image-tag }}"

  # ── 3. Gate : validation humaine avant d'élargir ────────────────────────────
  gate-25pct:
    name: "Gate — Valider avant 25%"
    runs-on: ubuntu-latest
    needs: canary-5pct
    environment: production-canary-gate   # ← Reviewer requis dans les settings GitHub

    steps:
      - name: Attente validation
        run: echo "✅ Validation approuvée — passage à 25%"

  # ── 4. Canary phase 2 : 25 % du trafic ──────────────────────────────────────
  canary-25pct:
    name: "Canary — 25%"
    runs-on: ubuntu-latest
    needs: gate-25pct

    steps:
      - name: Élargir canary à 25%
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/production
            export CANARY_WEIGHT=25
            export STABLE_WEIGHT=75
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload
            echo "✅ Canary 25% actif"

  # ── 5. Gate : validation finale avant rollout complet ────────────────────────
  gate-100pct:
    name: "Gate — Valider avant 100%"
    runs-on: ubuntu-latest
    needs: canary-25pct
    environment: production-canary-gate

    steps:
      - name: Attente validation finale
        run: echo "✅ Validation approuvée — rollout complet"

  # ── 6. Promotion : canary → stable (100%) ────────────────────────────────────
  promote:
    name: "Promouvoir canary → stable"
    runs-on: ubuntu-latest
    needs: gate-100pct
    permissions:
      packages: write

    steps:
      - name: Rollout 100% + tag latest
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/production

            # Promouvoir : canary devient stable
            export STABLE_IMAGE="${{ needs.build-push.outputs.full-image }}"
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend-stable

            # Remettre nginx à 100% stable
            export CANARY_WEIGHT=0
            export STABLE_WEIGHT=100
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload

            # Arrêter le canary container
            docker compose -f docker-compose.prod.yml stop frontend-canary

            echo "🚀 Déploiement complet — ${{ needs.build-push.outputs.image-tag }}"

      - name: Tag image latest
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker pull ${{ needs.build-push.outputs.full-image }}
          docker tag ${{ needs.build-push.outputs.full-image }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
