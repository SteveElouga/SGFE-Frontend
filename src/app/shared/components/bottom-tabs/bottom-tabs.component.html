<nav class="tabs" aria-label="Navigation principale">
  @for (item of nav.tabItems(); track item.route) {
    <a
      class="tabs__tab"
      [routerLink]="item.route"
      routerLinkActive="tabs__tab--active"
    >
      <span class="tabs__icon-wrap">
        <i aria-hidden="true" class="pi {{ item.icon }} tabs__icon"></i>
        @if (nav.badgeFor(item); as badge) {
          <span class="tabs__badge">{{ badge }}</span>
        } @else if (nav.dotFor(item)) {
          <span class="tabs__dot"></span>
        }
      </span>
      <span class="tabs__label">{{ (item.tabLabel ?? item.label) | translate }}</span>
    </a>
  }
</nav>
