name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule par défaut, élevé job par job seulement si un job en a
# réellement besoin. Aucun job de ce fichier ne pousse quoi que ce soit
# (le seul `push` Docker est `false`, cf. job docker-build) : contents:
# read seul suffit pour les 5 jobs, aucune élévation n'est nécessaire.
permissions:
  contents: read

jobs:
  # ── 1. Qualité du code ───────────────────────────────────────────────────────
  quality:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Audit des dépendances npm (chaîne d'approvisionnement — voir
      # docs/CONFORMITE_CICD.md, NIST PW.4/RV.1, CIS 3.2.2). Comme le Trivy
      # ci-dessous pour l'image, cette étape est volontairement bloquante sur
      # toute CVE HIGH/CRITICAL et n'est pas assouplie pour rester verte.
      #
      # Mesuré le 4 septembre 2026 : 8 HIGH (aucune CRITICAL), toutes dans des
      # dépendances de DÉVELOPPEMENT transitives de l'outillage de build
      # (`@angular/build` → esbuild/browserslist/postcss, `tar`, `undici`,
      # `nanoid`, `fast-uri`, `ip-address`, `brace-expansion`) — aucune dans le
      # code applicatif ni ses dépendances de production. Un gate qui inclut
      # `--omit=dev` échouerait dès son activation sur des paquets d'outillage
      # jamais expédiés — bruit permanent sans action possible ici (mise à
      # jour transitive hors du contrôle direct du dépôt). Périmètre du gate :
      # ce qui expédie réellement (`--omit=dev`) ; les vulnérabilités de
      # dépendances de dev restent suivies par `dependabot.yml` (écosystème
      # npm, ci-dessous), pas par ce contrôle bloquant.
      - name: Audit des dépendances de production (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # SAST — voir eslint.config.mjs pour le choix eslint-plugin-security
      # (plutôt que Semgrep) et la justification des règles désactivées.
      - name: Analyse de sécurité du code (ESLint)
        run: npm run lint:security

      # `tsc --noEmit` seul ne vérifiait RIEN : `tsconfig.json` est un
      # fichier-solution (`"files": []` plus des références de projet), donc le
      # programme construit était vide — 0 fichier de `src/app` sur 179. Cette
      # étape a été verte pendant toute la vie du dépôt sans lire une ligne. Le
      # mode build (`-b`) suit les références et vérifie les deux projets.
      - name: TypeScript check
        run: npm run verify:types

      # `generated.ts` est versionné : il peut donc vieillir. Un type qui décrit
      # l'ancienne sélection d'une requête compile parfaitement et remet
      # exactement la panne que le codegen est là pour empêcher.
      - name: Types GraphQL à jour
        run: npm run verify:codegen

      # Le proxy du serveur de dev et le nginx de production doivent desservir
      # les mêmes chemins d'API. Ils ont divergé de quatre familles — PDF, CSV,
      # synthèse, bilan — que la production renvoyait en `index.html` avec un
      # code 200. Une divergence des deux fichiers est juste de chaque côté :
      # seule une vérification qui les confronte peut l'attraper.
      #
      # Avant le build : c'est la vérification la moins chère du travail.
      - name: Jointure API dev ⇄ production
        run: npm run verify:jointure

      - name: Production build
        run: npx ng build --configuration production

      # Deux invariants que ni le compilateur ni les tests ne peuvent voir,
      # parce que chaque fichier est juste séparément — c'est son accord avec un
      # autre qui ne l'est pas :
      #
      #  • chaque écran routé dans la coquille marque sa région défilante, sans
      #    quoi le bas de la page est inatteignable, sans aucune erreur ;
      #  • aucun lien ne vise une route inexistante — le joker `**` les renvoie
      #    au login, ce qui déconnecte l'utilisateur sans rien dire.
      #
      # Les deux défauts ont existé. Les deux scripts les reproduisent sur le
      # code d'avant.
      - name: Invariants d'interface
        run: npm run verify:ui

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist/sgfe-frontend/browser/
          retention-days: 7

  # ── 2. Tests unitaires ───────────────────────────────────────────────────────
  # Ils existaient depuis le début et ne s'exécutaient nulle part : la CI
  # compilait le projet sans jamais lancer une seule assertion.
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run unit tests
        run: npx ng test --no-watch

  # ── 3. Docker build check + scan de sécurité (Trivy) ─────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # `load: true` : sans lui, l'image construite ne va nulle part — buildx
      # la jette après le build (`push: false` seul ne la garde pas accessible
      # localement). Trivy a besoin de la retrouver via le démon Docker du
      # runner pour la scanner juste après, à l'étape suivante.
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: sgfe-frontend:ci-${{ github.sha }}

      # Même motif que le backend (SGFE-backend/.github/workflows/_build-scan.yml,
      # cf. docs/ETAT_DU_SYSTEME.md §10) : scanner l'image tout juste construite
      # avant qu'elle ne soit poussée où que ce soit, et faire échouer le job sur
      # toute CVE CRITICAL/HIGH avec un correctif disponible.
      #
      # Validé localement (build + scan réels, hors CI) le 3 septembre 2026 :
      # l'image construit et se scanne sans erreur d'outillage. Le scan trouve
      # à cette date 2 CRITICAL et 35 HIGH, tous avec correctif disponible,
      # dans les paquets Alpine de la base `nginx:1.27-alpine` (dernière
      # reconstruction de ce tag : avril 2025) — pas dans le code applicatif.
      # Cette étape fera donc échouer la CI tant que l'image de base n'est pas
      # mise à jour ; corriger cela est hors du périmètre de cette tâche
      # (ajouter le contrôle), qui doit rester honnête sur ce qu'il révèle.
      - name: Scanner l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sgfe-frontend:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true

  # ── 4. Tests E2E Playwright ──────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      # webkit en plus de chromium : le projet `mobile-safari` du config le
      # réclame. Ne poser que chromium faisait échouer un tiers des projets
      # dès qu'une spec existait.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Plus de `--pass-with-no-tests` : le drapeau rendait le job vert sur un
      # `testDir` vide, c'est-à-dire toujours. Playwright démarre lui-même le
      # serveur (voir playwright.config.ts).
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  # ── 5. Scanner de mauvaise configuration des workflows (actionlint) ─────────
  # docs/CONFORMITE_CICD.md, item 13 du plan de remédiation (CIS 2.3.6, OWASP
  # CICD-SEC-8) : aucun des deux dépôts (backend compris) n'avait de scanner
  # de pipeline avant cette tâche — `actionlint` est retenu ici pour que le
  # même outil serve de référence si/quand le backend l'adopte à son tour.
  # Job léger et indépendant des autres (pas de `npm ci`, pas de build) :
  # analyse les 4 fichiers de workflow du dépôt pour des erreurs de syntaxe,
  # des `${{ }}` mal utilisés dans un `run:` (risque d'injection de script),
  # des vérifications `shellcheck` basiques, etc.
  lint-workflows:
    name: Lint des workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # `github-pr-check` (ci-dessous) poste un Check Run natif — c'est le
      # seul reporter réellement documenté par cette action (`reporter:
      # local` n'existe pas : testé en CI réelle, échoue avec "reviewdog:
      # diff command is empty", `local` tente quand même de calculer un
      # diff). `checks: write` élevé uniquement sur ce job, pas au niveau du
      # workflow.
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: actionlint
        uses: reviewdog/action-actionlint@0226391db11971cf3c42df3c907fd647e8dc1673 # v1
        with:
          reporter: github-pr-check
          # `nofilter` : signale tout le fichier, pas seulement les lignes
          # changées — un fichier de workflow entier doit être valide, pas
          # seulement sa diff.
          filter_mode: nofilter
          fail_level: error

  # ── 6. Point d'agrégation pour la protection de branche ──────────────────────
  # docs/CONFORMITE_CICD.md, item 2 du plan de remédiation (CICD-SEC-1) : ce
  # dépôt n'avait aucune protection de branche, en partie parce qu'il n'existait
  # aucun check unique à exiger (5 jobs indépendants, dont deux — e2e et
  # docker-build — ne tournent pas sur toutes les PR selon les chemins
  # modifiés). Même patron que `SGFE-Backend/.github/workflows/ci.yml` : un
  # seul job agrégateur, requis en protection de branche, qui échoue si l'un
  # des jobs listés a échoué.
  ci-status:
    name: Statut CI
    if: always()
    needs: [quality, unit-tests, docker-build, e2e, lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie qu'aucun job requis n'a échoué
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Au moins un job a échoué."
            exit 1
          fi
