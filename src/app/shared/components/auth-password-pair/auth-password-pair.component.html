<app-auth-field [label]="newPasswordLabel()">
  <p-password
    [inputId]="newPasswordId()"
    placeholder="••••••••"
    [feedback]="true"
    [toggleMask]="true"
    [fluid]="true"
    autocomplete="new-password"
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
    name="newPassword"
  />
</app-auth-field>

<app-auth-field [label]="confirmPasswordLabel()">
  <p-password
    [inputId]="confirmPasswordId()"
    placeholder="••••••••"
    [feedback]="false"
    [toggleMask]="true"
    [fluid]="true"
    autocomplete="new-password"
    [invalid]="!passwordsMatch()"
    [ngModel]="confirmPassword()"
    (ngModelChange)="confirmPassword.set($event)"
    name="confirmPassword"
  />
  <!-- `polite` et non `alert` : le message apparaît pendant la frappe, et une
       interruption à chaque caractère saisi rendrait le champ inutilisable. -->
  @if (!passwordsMatch()) {
    <span class="auth-screen__hint auth-screen__hint--error" role="status" aria-live="polite">
      {{ 'AUTH.MDP_DIFFERENTS' | translate }}
    </span>
  }
</app-auth-field>
