<p-confirmdialog />

<app-page-topbar
  [title]="'UTILISATEURS.TITLE' | translate"
  [subtitle]="subtitle()"
>
  <a routerLink="/utilisateurs/nouveau" class="page-topbar-action">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
      <path d="M6.5 1v11M1 6.5h11" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    {{ 'UTILISATEURS.NEW' | translate }}
  </a>
</app-page-topbar>

<div class="users-content">

  @if (error()) {
    <app-error-banner [message]="error()!" (retry)="loadUsers()" />
  }

  <app-filter-bar
    [search]="searchTerm()"
    (searchChange)="searchTerm.set($event)"
    searchPlaceholder="UTILISATEURS.SEARCH_PLACEHOLDER"
  >
    <p-select
      class="users-filters__select"
      [options]="roleOptions()"
      [ngModel]="filtreRole()"
      (ngModelChange)="filtreRole.set($event)"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'UTILISATEURS.FILTRE_ROLE' | translate"
      [showClear]="true"
    />

    <p-select
      class="users-filters__select"
      [options]="statutOptions()"
      [ngModel]="filtreStatut()"
      (ngModelChange)="filtreStatut.set($event)"
      optionLabel="label"
      optionValue="value"
    />
  </app-filter-bar>

  <div class="users-card">
    <app-data-table
      [columns]="columns"
      [rows]="filteredUsers()"
      [loading]="loading()"
      [pageSize]="20"
      trackKey="id"
      [emptyMessage]="emptyMsg()"
    >
      <ng-template appCol="username" let-user>
        <div class="users-table__user">
          <span class="users-table__username">{{ user.username }}</span>
          @if (user.email) {
            <span class="users-table__email">{{ user.email }}</span>
          }
        </div>
      </ng-template>

      <ng-template appCol="phone" let-user><span class="users-table__phone">{{ user.phoneNumber }}</span></ng-template>

      <ng-template appCol="role" let-user>
        <p-tag
          [value]="'UTILISATEURS.ROLES.' + user.role | translate"
          [severity]="roleSeverity(user.role)"
        />
      </ng-template>

      <ng-template appCol="statut" let-user>
        <app-status-badge [status]="user.isActive ? 'ACTIVE' : 'INACTIVE'" />
      </ng-template>

      <ng-template appCol="createdAt" let-user><span class="users-table__date">{{ user.createdAt | date:'dd/MM/yyyy' }}</span></ng-template>

      <ng-template appCol="actions" let-user>
        <div class="users-table__actions">
          <button
            type="button"
            class="users-table__action-btn"
            [appTooltip]="('COMMON.EDIT' | translate) + ' ' + user.username"
            (click)="editUser(user)"
          >
            <i class="pi pi-pencil"></i>
          </button>
          @if (user.isActive) {
            <button
              type="button"
              class="users-table__action-btn users-table__action-btn--danger"
              [appTooltip]="('UTILISATEURS.DESACTIVER' | translate) + ' ' + user.username"
              [tooltipPosition]="'left'"
              (click)="confirmDeactivate(user)"
            >
              <i class="pi pi-ban"></i>
            </button>
          }
        </div>
      </ng-template>
    </app-data-table>
  </div>

</div>
