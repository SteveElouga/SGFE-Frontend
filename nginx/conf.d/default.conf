# nginx du frontend — le point d'entrée du navigateur.
#
# Il sert le build Angular ET proxyfie tout ce que l'application appelle en HTTP
# vers l'API. Le nginx du dépôt backend n'est PAS sur ce chemin : il reste
# l'arête de l'API pour un accès direct (publié en :8080).
#
# ── La jointure entre les deux piles ─────────────────────────────────────────
#
# Le frontend et le backend sont deux projets Compose distincts, donc deux
# réseaux étanches. Le backend crée le réseau `sgfe-edge` et y raccroche son
# seul service `gateway` ; ce conteneur-ci le rejoint en `external: true` (voir
# les deux `docker-compose*.yml`). L'amont est donc `gateway:8000` — le service
# Django lui-même, pas le nginx du backend.
#
# Pourquoi pas le nginx du backend comme amont : son `limit_req_zone` compte par
# `$binary_remote_addr`, qui serait alors l'adresse de CE conteneur. Les 30 r/s
# seraient partagés par tous les utilisateurs à la fois, et une poignée de postes
# suffirait à se faire renvoyer des 429. Le débit se limite là où l'adresse du
# client est encore vraie : ici.

# Résolution DNS Docker différée, et non au chargement de la configuration.
#
# `proxy_pass http://gateway:8000` avec un nom littéral se résout au démarrage :
# si le gateway n'est pas encore là, nginx refuse de démarrer sur un
# « host not found in upstream » et le conteneur ne devient jamais sain. Passer
# par une VARIABLE reporte la résolution à chaque requête — nginx démarre, et un
# gateway recréé (nouvelle IP) ne laisse pas non plus de 502 derrière lui.
resolver 127.0.0.11 valid=10s;

# Limitation de débit par IP — posée ici parce que c'est ici que l'adresse du
# client est réelle. Appliquée aux appels d'API SEULEMENT : un premier
# chargement d'Angular tire des dizaines de fragments JS d'un coup et
# dépasserait tout seuil raisonnable.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Amont unique, en variable — voir le `resolver` ci-dessus.
    set $api gateway:8000;

    # ── Health check (Docker / load balancer canary) ─────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── GraphQL → gateway (HTTP et WebSocket sur le même chemin) ─────────────
    #
    # Même origine que la page, ce qui est la condition pour que le cookie
    # `refresh_token` (HttpOnly, SameSite=Strict) soit envoyé.
    #
    # Les subscriptions passent par ce même `/graphql` en WebSocket : l'URL est
    # dérivée de l'origine de la page côté client (voir `apollo.config.ts`), plus
    # d'un domaine écrit en dur.
    location /graphql {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://$api/graphql;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;   # une subscription reste ouverte
        proxy_connect_timeout 10s;
    }

    # ── Endpoints REST du gateway ────────────────────────────────────────────
    #
    # Ces six familles sont celles que `proxy.conf.json` proxyfie en
    # développement. Elles n'étaient pas ici : en production elles tombaient
    # dans le fallback SPA et renvoyaient `index.html` avec un code 200.
    # « Télécharger le PDF » livrait donc une page HTML, sans erreur visible —
    # le pire mode de défaillance possible pour un téléchargement.
    #
    # Chacune est déclarée explicitement plutôt que par un `location /api`
    # fourre-tout : le gateway sert ces chemins à la RACINE, et un préfixe
    # commun n'existe pas. Une famille oubliée ici est une famille cassée.
    #
    # Espace abonné public (lien WhatsApp tokenisé) — JSON des factures + PDF.
    # À déclarer avant le fallback SPA : la route Angular `/espace/:token` est
    # un chemin distinct de l'API `/espace-abonne/...`, aucune collision.
    location /espace-abonne/ { limit_req zone=api_limit burst=60 nodelay; include /etc/nginx/api_proxy.conf; }

    # PDF d'une facture (back-office authentifié).
    location ~ ^/factures/[^/]+/pdf/ { limit_req zone=api_limit burst=60 nodelay; include /etc/nginx/api_proxy.conf; }

    # Reçu de paiement (PDF).
    location ~ ^/paiements/[^/]+/recu/pdf/ { limit_req zone=api_limit burst=60 nodelay; include /etc/nginx/api_proxy.conf; }

    # Exports comptables CSV.
    location ~ ^/rapports/ { limit_req zone=api_limit burst=60 nodelay; include /etc/nginx/api_proxy.conf; }

    # Bilan des impayés (PDF).
    location /bilan-impayes { limit_req zone=api_limit burst=60 nodelay; include /etc/nginx/api_proxy.conf; }

    # ── Assets immuables (hachés par Angular) ────────────────────────────────
    #
    # Avant les règles de page : un `location ~*` l'emporte sur le préfixe `/`,
    # mais pas sur les préfixes d'API ci-dessus, qui sont testés d'abord dans
    # l'ordre de nginx (préfixe exact, puis regex dans l'ordre du fichier).
    location ~* \.(js|css|woff2|woff|ttf|otf|png|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA : service worker et manifest ─────────────────────────────────────
    location ~* (ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Angular SPA (HTML5 routing) ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security_headers.conf;

        # Pas de cache sur index.html (le service worker gère le reste).
        #
        # Les en-têtes de sécurité sont réinclus ici, et ce n'est pas une
        # redondance : `add_header` ne s'hérite pas, donc le `Cache-Control`
        # ci-dessous effacerait à lui seul le CSP du bloc parent — sur le seul
        # document de tout le site qui exécute du script.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/security_headers.conf;
        }
    }

    # ── Compression Gzip ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}
