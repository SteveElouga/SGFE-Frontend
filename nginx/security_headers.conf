# En-têtes de sécurité des documents HTML.
#
# ── Pourquoi un fichier inclus deux fois, et non un `add_header` au niveau du
#    bloc `server` ────────────────────────────────────────────────────────────
#
# `add_header` ne s'hérite PAS : dès qu'un bloc enfant pose son propre
# `add_header`, il remplace l'ensemble des en-têtes du parent au lieu de s'y
# ajouter. Un CSP posé sur `server` disparaîtrait donc de `= /index.html`, qui
# pose son `Cache-Control` — c'est-à-dire du seul document qui exécute du
# script, et le seul où le CSP compte.
#
# D'où l'inclusion explicite dans les deux blocs. Ce n'est pas une redondance à
# nettoyer : la retirer d'un des deux endroits désarme silencieusement la
# politique.
#
# ── Ce que la politique autorise ─────────────────────────────────────────────
#
# Le nginx du dépôt backend pose `default-src 'none'`, ce qui est juste pour une
# API et interdirait ici jusqu'au chargement d'Angular. Celle-ci est taillée
# pour la SPA :
#
#   script-src 'self'          aucun script externe, aucun `unsafe-inline`
#   style-src  'unsafe-inline' PrimeNG injecte ses styles à l'exécution
#   img-src    data: blob:     PDF prévisualisés, QR WhatsApp, images inline
#   connect-src ws: wss:       le WebSocket des subscriptions, même origine
#   frame-ancestors 'none'     pas d'iframe : protection anti-clickjacking
#   base-uri   'self'          voir l'avertissement ci-dessous — jamais 'none'
#
# ── `base-uri 'none'` cassait silencieusement TOUTE navigation directe vers une
#    route à 2 segments ou plus ─────────────────────────────────────────────────
#
# `index.html` généré par Angular contient `<base href="/">` : la SPA en a besoin
# pour résoudre en racine les chemins relatifs de ses bundles (`<script
# src="main-XXXX.js">`, sans `/` en tête). `base-uri 'none'` interdit à N'IMPORTE
# QUEL élément <base> de fixer l'URL de base du document — y compris celui-là,
# pourtant same-origin et légitime. Le navigateur l'ignore alors silencieusement
# (aucune erreur visible hors la console) et retombe sur l'URL du document
# lui-même comme URL de base.
#
# Pour une route à un seul segment (`/dashboard`), la résolution d'URL relative
# remplace justement ce seul segment par le nom du fichier et retombe pile sur
# la racine par coïncidence arithmétique — d'où l'illusion que « ça marche ».
# Dès 2 segments (`/abonnes/nouveau`, `/campagnes/{id}`, …), seul le DERNIER
# segment est remplacé : les bundles sont alors demandés en
# `/abonnes/main-XXXX.js` (404/503) au lieu de `/main-XXXX.js`, page blanche
# permanente. Ce n'est ni un bug nginx (`try_files` sert le bon fichier) ni un
# bug du service worker (reproduit identiquement sans lui, SW désenregistré) :
# uniquement cet en-tête, sur CHAQUE navigation.
#
# `base-uri 'self'` garde la protection recherchée (aucune page tierce ne peut
# injecter un <base> pointant hors origine pour détourner les URL relatives —
# la faille que `base-uri` existe pour bloquer) tout en laissant s'appliquer le
# <base> same-origin que l'app pose elle-même.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
