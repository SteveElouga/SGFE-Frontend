<!-- Cette feuille refaisait sa propre chrome : voile, panneau, poignée,
     et 268 lignes de style qui recopiaient celles du composant partagé.
     Elle en avait donc l'apparence et l'animation — mais ni le geste de
     glissement, ni la touche Échap, ni le piège à focus. La poignée
     promettait un geste qui n'existait pas : une affordance qui ment coûte
     plus cher que pas d'affordance du tout. -->
<app-bottom-sheet [open]="open()" labelledBy="agents-sheet-title" (close)="onClose()">
  <div class="agents-sheet__title" id="agents-sheet-title">{{ 'CAMPAGNES.AGENTS_SHEET.TITLE' | translate }}</div>
  <div class="agents-sheet__subtitle">
    {{ sousTitreCle() | translate:{ n: selectedCount() } }}
  </div>

  <div class="agents-search">
    <i aria-hidden="true" class="pi pi-search"></i>
    <!-- Un placeholder n'est pas une étiquette : il disparaît dès la première
         frappe, et les lecteurs d'écran ne le traitent pas tous de la même
         façon. Le champ porte donc son nom, en plus de son indication. -->
    <input
      type="search"
      [ngModel]="search()"
      (ngModelChange)="onSearch($event)"
      [placeholder]="'CAMPAGNES.AGENTS_SHEET.SEARCH' | translate"
      [attr.aria-label]="'CAMPAGNES.AGENTS_SHEET.SEARCH' | translate"
    />
  </div>

  <div class="agents-list">
    @if (loading()) {
      <div class="agents-loading"><i aria-hidden="true" class="pi pi-spin pi-spinner"></i></div>
    } @else {
      @for (a of filtered(); track a.id) {
        <button
          type="button"
          class="agent-row"
          [class.agent-row--selected]="isSelected(a)"
          [class.agent-row--disabled]="!a.isActive"
          [class.agent-row--locked]="isLocked(a)"
          [disabled]="!a.isActive || isLocked(a)"
          (click)="toggle(a)"
        >
          <span class="agent-avatar">{{ initial(a.username) }}</span>
          <span class="agent-info">
            <span class="agent-name">{{ a.username }}</span>
            <span class="agent-sub">
              @if (!a.isActive) {
                {{ 'CAMPAGNES.AGENTS_SHEET.DISABLED' | translate }}
              } @else if (isLocked(a)) {
                {{ 'CAMPAGNES.AGENTS_SHEET.ALREADY' | translate }}
              } @else {
                {{ a.phoneNumber || ('CAMPAGNES.AGENTS_SHEET.AGENT' | translate) }}
              }
            </span>
          </span>
          <span class="agent-check" [class.agent-check--on]="isSelected(a)">
            @if (isSelected(a)) { <i aria-hidden="true" class="pi pi-check"></i> }
          </span>
        </button>
      } @empty {
        <div class="agents-empty">{{ 'CAMPAGNES.AGENTS_SHEET.EMPTY' | translate }}</div>
      }
    }
  </div>

  <button type="button" class="agents-save" [disabled]="saving()" (click)="onSave()">
    @if (saving()) { <i aria-hidden="true" class="pi pi-spin pi-spinner"></i> }
    {{ 'CAMPAGNES.AGENTS_SHEET.SAVE' | translate }}
  </button>
  <button type="button" class="agents-cancel" (click)="onClose()">
    {{ 'COMMON.CANCEL' | translate }}
  </button>
</app-bottom-sheet>
