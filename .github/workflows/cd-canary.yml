name: Deploy → Production (Canary)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Ne jamais annuler un déploiement prod en cours

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sgfe-frontend

jobs:
  # ── 1. Build & Push ──────────────────────────────────────────────────────────
  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      full-image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=canary

      # Étape ajoutée (docs/CONFORMITE_CICD.md, item 1 / OWASP CICD-SEC-9) :
      # avant, aucune image réellement déployée n'était scannée nulle part —
      # le seul Trivy du dépôt (ci.yml) tourne sur une image jetable, jamais
      # poussée. On construit ici localement (load: true, push: false, même
      # scope de cache GHA que l'étape « Build & push » plus bas) pour
      # scanner CETTE image avant qu'elle n'atteigne GHCR.
      - name: Build image (scan avant publication)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: sgfe-frontend:canary-${{ github.sha }}

      # Même bloc que ci.yml (job docker-build, lignes 138-145) : une CVE
      # CRITICAL/HIGH fait échouer ce job AVANT le push ci-dessous — donc
      # avant que l'image n'atteigne GHCR ni ne soit déployée en canary.
      - name: Scanner l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sgfe-frontend:canary-${{ github.sha }}
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true

      # Repousse le même contexte de build à travers le cache GHA déjà chaud
      # (cache-from/to identiques à l'étape précédente) : ce second appel ne
      # reconstruit pas les couches, il les publie. `sbom`/`provenance` ne
      # peuvent pas être attachés à une image seulement `load: true` (pas de
      # manifeste de registre) — c'est pourquoi ils sont posés ici et pas sur
      # l'étape de scan ci-dessus.
      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  # ── 2. Canary phase 1 : 5 % du trafic ───────────────────────────────────────
  canary-5pct:
    name: "Canary — 5%"
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: ${{ vars.ENV_CANARY || 'production-canary' }}
      url: https://aquabill.cm

    steps:
      - name: Deploy canary container (5%)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/production

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Démarrer le container canary avec la nouvelle image
            export CANARY_IMAGE="${{ needs.build-push.outputs.full-image }}"
            docker compose -f docker-compose.prod.yml pull frontend-canary
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend-canary

            # Appliquer la config nginx LB : stable=95 canary=5
            export CANARY_WEIGHT=5
            export STABLE_WEIGHT=95
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload

            sleep 10
            curl -sf http://localhost/health || exit 1
            echo "✅ Canary 5% actif — ${{ needs.build-push.outputs.image-tag }}"

  # ── 3. Gate : validation humaine avant d'élargir ────────────────────────────
  gate-25pct:
    name: "Gate — Valider avant 25%"
    runs-on: ubuntu-latest
    needs: canary-5pct
    environment:
      name: ${{ vars.ENV_CANARY_GATE || 'production-canary-gate' }}

    steps:
      - name: Attente validation
        run: echo "✅ Validation approuvée — passage à 25%"

  # ── 4. Canary phase 2 : 25 % du trafic ──────────────────────────────────────
  canary-25pct:
    name: "Canary — 25%"
    runs-on: ubuntu-latest
    needs: gate-25pct
    environment:
      name: ${{ vars.ENV_CANARY || 'production-canary' }}
      url: https://aquabill.cm

    steps:
      - name: Élargir canary à 25%
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/production
            export CANARY_WEIGHT=25
            export STABLE_WEIGHT=75
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload
            echo "✅ Canary 25% actif"

  # ── 5. Gate : validation finale avant rollout complet ────────────────────────
  gate-100pct:
    name: "Gate — Valider avant 100%"
    runs-on: ubuntu-latest
    needs: canary-25pct
    environment:
      name: ${{ vars.ENV_CANARY_GATE || 'production-canary-gate' }}

    steps:
      - name: Attente validation finale
        run: echo "✅ Validation approuvée — rollout complet"

  # ── 6. Promotion : canary → stable (100%) ────────────────────────────────────
  promote:
    name: "Promouvoir canary → stable"
    runs-on: ubuntu-latest
    needs: [gate-100pct, build-push]
    environment:
      name: ${{ vars.ENV_CANARY || 'production-canary' }}
      url: https://aquabill.cm
    permissions:
      packages: write

    steps:
      - name: Rollout 100% + tag latest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/aquabill/production

            # Promouvoir : canary devient stable
            export STABLE_IMAGE="${{ needs.build-push.outputs.full-image }}"
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend-stable

            # Remettre nginx à 100% stable
            export CANARY_WEIGHT=0
            export STABLE_WEIGHT=100
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload

            # Arrêter le canary container
            docker compose -f docker-compose.prod.yml stop frontend-canary

            echo "🚀 Déploiement complet — ${{ needs.build-push.outputs.image-tag }}"

      - name: Tag image latest
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker pull ${{ needs.build-push.outputs.full-image }}
          docker tag ${{ needs.build-push.outputs.full-image }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
