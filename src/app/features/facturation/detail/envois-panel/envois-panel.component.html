<!-- WhatsApp journal -->
@if (envois().length > 0) {
  <div class="carte detail-card">
    <div class="calc-title">{{ 'FACTURATION.DETAIL.TITLE_WHATSAPP' | translate }}</div>
    <div class="journal-list">
      @for (e of envois(); track e.envoiId) {
        <div class="journal-entry" [class]="envoiClass(e)">
          <div class="journal-entry__head">
            <span class="journal-entry__text">{{ envoiTypeLabel(e) }} · {{ envoiStatutLabel(e) }}</span>
            <span class="journal-entry__meta">
              @if (e.dateEnvoi) {
                <span class="journal-entry__date">{{ formatDate(e.dateEnvoi) }}</span>
              }
              <!-- Le bouton ne s'affichait que sur un échec. Un reçu bien
                   envoyé que l'abonné redemande — message perdu, téléphone
                   changé, copie demandée au guichet — n'avait donc aucun
                   chemin de renvoi, sur cet écran ni sur aucun autre.
                   Réessayer et renvoyer sont le même geste technique ; ils
                   ne disent pas la même chose, d'où deux libellés. -->
              <button
                type="button"
                class="journal-entry__retry"
                [disabled]="renvoiEnCours() === e.envoiId"
                (click)="rejouer.emit(e.envoiId)"
              >
                <i aria-hidden="true" class="pi pi-replay"></i>
                {{ (e.erreur ? 'COMMON.RETRY' : 'ENVOIS.RESEND') | translate }}
              </button>
            </span>
          </div>
          @if (e.erreur) {
            <div class="journal-entry__err" [attr.title]="e.erreur">{{ cleanErreur(e.erreur) }}</div>
          }
        </div>
      }
    </div>
  </div>
}
