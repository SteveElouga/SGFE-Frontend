<div class="dashboard">
  <header class="dashboard__header">
    <div>
      <h1 class="dashboard__title">Tableau de bord</h1>
      @if (user()) {
        <p class="dashboard__welcome">Bonjour, {{ user()!.username }}</p>
      }
    </div>
  </header>

  <div class="dashboard__grid">

    <a routerLink="/abonnes" class="dashboard__card dashboard__card--primary">
      <div class="dashboard__card-icon">
        <i class="pi pi-users"></i>
      </div>
      <div class="dashboard__card-body">
        <h2 class="dashboard__card-title">Abonnés</h2>
        <p class="dashboard__card-desc">Gérer les abonnés et leurs compteurs d'eau</p>
      </div>
      <i class="pi pi-arrow-right dashboard__card-arrow"></i>
    </a>

    <a routerLink="/utilisateurs" class="dashboard__card">
      <div class="dashboard__card-icon">
        <i class="pi pi-user-edit"></i>
      </div>
      <div class="dashboard__card-body">
        <h2 class="dashboard__card-title">Utilisateurs</h2>
        <p class="dashboard__card-desc">Gérer les comptes agents, comptables et administrateurs</p>
      </div>
      <i class="pi pi-arrow-right dashboard__card-arrow"></i>
    </a>

  </div>
</div>
