<!-- Bouton déclencheur — même visuel que l'ancien footer sidebar -->
<button class="um-trigger" type="button" (click)="toggle($event)">
  <div class="um-trigger__avatar">{{ userInitial() }}</div>
  @if (user(); as u) {
    <div class="um-trigger__info">
      <span class="um-trigger__name">{{ u.username }}</span>
      <span class="um-trigger__role">{{ u.role }}</span>
    </div>
  }
  <i aria-hidden="true" class="pi pi-chevron-down um-trigger__chevron" [class.um-trigger__chevron--open]="isOpen()"></i>
</button>

<!-- Panneau overlay -->
<p-popover #menu styleClass="um-popover" (onShow)="onShow()" (onHide)="onHide()">

  <!-- En-tête utilisateur -->
  @if (user(); as u) {
    <div class="um-header">
      <span class="um-header__avatar">
        {{ userInitial() }}
      </span>
      <div class="um-header__info">
        <span class="um-header__name">{{ u.username }}</span>
        <span class="um-header__sub">{{ u.role }} · {{ u.username }}</span>
      </div>
    </div>
  }

  <div class="um-divider"></div>

  <!-- Navigation -->
  <nav class="um-nav">
    <a
      class="um-item"
      routerLink="/profil"
      routerLinkActive="um-item--active"
      (click)="close()"
    >
      <i aria-hidden="true" class="pi pi-user um-item__icon"></i>
      <span>{{ 'USER_MENU.PROFILE' | translate }}</span>
    </a>

    @if (isAdmin()) {
      <a
        class="um-item"
        routerLink="/utilisateurs"
        routerLinkActive="um-item--active"
        (click)="close()"
      >
        <i aria-hidden="true" class="pi pi-users um-item__icon"></i>
        <span>{{ 'USER_MENU.USERS' | translate }}</span>
      </a>
    }
  </nav>

  <div class="um-divider"></div>

  <!-- Langue -->
  <div class="um-lang">
    <i aria-hidden="true" class="pi pi-globe um-lang__icon"></i>
    <span class="um-lang__label">{{ 'USER_MENU.LANG' | translate }}</span>
    <div class="um-lang__toggle">
      <button
        class="um-lang__btn"
        [class.um-lang__btn--active]="currentLang() === 'fr'"
        type="button"
        (click)="setLang('fr')"
      >FR</button>
      <button
        class="um-lang__btn"
        [class.um-lang__btn--active]="currentLang() === 'en'"
        type="button"
        (click)="setLang('en')"
      >EN</button>
    </div>
  </div>

  <div class="um-divider"></div>

  <!-- Thème -->
  <div class="um-theme">
    <i aria-hidden="true" class="pi pi-moon um-theme__icon"></i>
    <span class="um-theme__label">{{ 'USER_MENU.THEME' | translate }}</span>
    <div class="um-theme__toggle">
      <button
        class="um-theme__btn"
        [class.um-theme__btn--active]="themePreference() === 'auto'"
        type="button"
        (click)="setTheme('auto')"
      >{{ 'USER_MENU.THEME_AUTO' | translate }}</button>
      <button
        class="um-theme__btn"
        [class.um-theme__btn--active]="themePreference() === 'light'"
        type="button"
        (click)="setTheme('light')"
      >{{ 'USER_MENU.THEME_LIGHT' | translate }}</button>
      <button
        class="um-theme__btn"
        [class.um-theme__btn--active]="themePreference() === 'dark'"
        type="button"
        (click)="setTheme('dark')"
      >{{ 'USER_MENU.THEME_DARK' | translate }}</button>
    </div>
  </div>

  <div class="um-divider"></div>

  <!-- Déconnexion -->
  <button class="um-item um-item--logout" type="button" (click)="logout()">
    <i aria-hidden="true" class="pi pi-sign-out um-item__icon"></i>
    <span>{{ 'USER_MENU.LOGOUT' | translate }}</span>
  </button>

</p-popover>
