<div class="auth-screen">
  <div class="auth-screen__panel">
    @if (success()) {
      <div class="auth-screen__success">
        <h2>Mot de passe défini</h2>
        <p>Votre mot de passe a bien été enregistré. Vous pouvez maintenant vous connecter.</p>
        <a class="auth-screen__back" routerLink="/login">Aller à la connexion</a>
      </div>
    } @else {
      <form class="auth-screen__form" (ngSubmit)="onSubmit()">
        <h2>{{ copy.title }}</h2>
        <p class="auth-screen__subtitle">{{ copy.subtitle }}</p>

        <label class="auth-screen__field" for="password">
          <span>Nouveau mot de passe</span>
          <p-password
            inputId="password"
            [feedback]="true"
            [toggleMask]="true"
            [fluid]="true"
            autocomplete="new-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
          />
        </label>

        <label class="auth-screen__field" for="confirmPassword">
          <span>Confirmer le mot de passe</span>
          <p-password
            inputId="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            [fluid]="true"
            autocomplete="new-password"
            [invalid]="!passwordsMatch()"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
          />
          @if (!passwordsMatch()) {
            <span class="auth-screen__hint auth-screen__hint--error">
              Les mots de passe ne correspondent pas
            </span>
          }
        </label>

        @if (errorMessage()) {
          <p-message severity="error" [text]="errorMessage()!" />
        }

        <p-button
          type="submit"
          [label]="copy.submitLabel"
          icon="pi pi-check"
          iconPos="right"
          [loading]="loading()"
          [disabled]="!canSubmit()"
          styleClass="auth-screen__submit"
        />
      </form>
    }
  </div>
</div>
