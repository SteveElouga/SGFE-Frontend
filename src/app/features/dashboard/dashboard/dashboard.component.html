<div class="dashboard">
  <header class="dashboard__header">
    <div>
      <h1 class="dashboard__title">{{ 'DASHBOARD.TITLE' | translate }}</h1>
      @if (user()) {
        <p class="dashboard__welcome">{{ 'DASHBOARD.WELCOME' | translate:{ username: user()!.username } }}</p>
      }
    </div>
  </header>

  <div class="dashboard__grid">

    <a routerLink="/abonnes" class="dashboard__card dashboard__card--primary">
      <div class="dashboard__card-icon">
        <i class="pi pi-users"></i>
      </div>
      <div class="dashboard__card-body">
        <h2 class="dashboard__card-title">{{ 'DASHBOARD.ABONNES_TITLE' | translate }}</h2>
        <p class="dashboard__card-desc">{{ 'DASHBOARD.ABONNES_DESC' | translate }}</p>
      </div>
      <i class="pi pi-arrow-right dashboard__card-arrow"></i>
    </a>

    <a routerLink="/utilisateurs" class="dashboard__card">
      <div class="dashboard__card-icon">
        <i class="pi pi-user-edit"></i>
      </div>
      <div class="dashboard__card-body">
        <h2 class="dashboard__card-title">{{ 'DASHBOARD.USERS_TITLE' | translate }}</h2>
        <p class="dashboard__card-desc">{{ 'DASHBOARD.USERS_DESC' | translate }}</p>
      </div>
      <i class="pi pi-arrow-right dashboard__card-arrow"></i>
    </a>

  </div>
</div>
