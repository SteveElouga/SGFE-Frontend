server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Health check (Docker / load balancer) ────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── GraphQL proxy → API Gateway (same-origin pour SameSite=Strict) ───────
    location /graphql {
        proxy_pass         http://api-gateway:8080/graphql;
        proxy_http_version 1.1;

        # WebSocket (subscriptions GraphQL)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_connect_timeout 10s;
    }

    # ── Espace abonné public (lien WhatsApp tokenisé) → API Gateway ──────────
    # Endpoint REST du gateway (JSON des factures + PDF), à la racine avec slash
    # final. À proxifier AVANT le fallback SPA `location /`, sinon nginx servirait
    # index.html. La route Angular `/espace/:token` (SPA) est distincte de ce
    # chemin API `/espace-abonne/...` : aucune collision.
    location /espace-abonne/ {
        proxy_pass         http://api-gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
    }

    # ── Angular SPA (HTML5 routing) ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Pas de cache sur index.html (le service worker gère le reste)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Assets immuables (hachés par Angular) ────────────────────────────────
    location ~* \.(js|css|woff2|woff|ttf|otf|png|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA : service worker et manifest ─────────────────────────────────────
    location ~* (ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Compression Gzip ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}
