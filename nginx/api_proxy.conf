# Directives de proxy vers le gateway, partagées par les cinq familles de
# chemins REST. Incluses depuis chaque `location` de `conf.d/default.conf`.
#
# Extraites dans un fichier plutôt que recopiées cinq fois : une famille dont le
# proxy diverge des autres est un bug qui ne se voit pas à la lecture.
#
# `$api` est posé par un `set` du bloc `server` (voir `conf.d/default.conf`) et
# vaut `gateway:8000`. Le passage par une VARIABLE est délibéré : il reporte la
# résolution DNS à chaque requête, au lieu du chargement de la configuration —
# sans quoi nginx refuse de démarrer quand le gateway n'est pas encore levé.
#
# Pas de partie URI après `$api` : nginx transmet alors l'URI de la requête
# telle quelle, ce qui est exactement ce qu'il faut ici (le gateway sert ces
# chemins à la racine, sous les mêmes noms).

limit_req_status 429;

proxy_pass         http://$api;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;

# Un PDF de facture est généré par WeasyPrint à la demande, et un CSV de
# campagne agrège plusieurs services par gRPC. Les 60 s par défaut de nginx
# suffisent, mais de justesse sur une grosse campagne.
proxy_read_timeout 120s;
