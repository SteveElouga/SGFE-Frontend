<div class="error-banner" role="alert">
  <svg class="error-banner__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="8" cy="8" r="7" stroke="#b91c1c" stroke-width="1.3"/>
    <path d="M8 5v3.5M8 10.5v.5" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <span class="error-banner__message">{{ message() }}</span>
  @if (showRetry()) {
    <button class="error-banner__retry" type="button" (click)="retry.emit()">
      {{ retryLabel() }}
    </button>
  }
</div>
