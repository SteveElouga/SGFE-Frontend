<div class="paiement-form__grid">
  <div class="pf-field">
    <label class="pf-label" [attr.for]="montantId()">{{ 'FACTURATION.PANEL_MONTANT' | translate }}<span class="pf-required" aria-hidden="true">*</span></label>
    <input
      [id]="montantId()"
      type="text"
      inputmode="numeric"
      pInputText
      class="pf-input pf-input--focus"
      [ngModel]="pMontant()"
      (ngModelChange)="pMontant.set($event)"
      [attr.aria-describedby]="excedent() > 0 ? montantErrId() : null"
    />
    @if (excedent() > 0) {
      <!-- Information, pas erreur : le trop-perçu est une capacité du système,
           pas une faute de saisie. Ton neutre, pas de rôle « alert ». -->
      <span [id]="montantErrId()" class="pf-hint pf-hint--info">
        {{ 'FACTURATION.PANEL_MONTANT_EXCEDENT' | translate:{montant: excedent().toLocaleString('fr-FR')} }}
      </span>
    }
  </div>

  <div class="pf-field">
    <label class="pf-label pf-label--help" [attr.for]="modeId()">
      {{ 'FACTURATION.PANEL_MODE' | translate }}<span class="pf-required" aria-hidden="true">*</span>
      <i aria-hidden="true"
        class="pi pi-info-circle pf-help"
        [appTooltip]="'FACTURATION.PANEL_MODE_TOOLTIP' | translate"
        tabindex="0"
        [attr.aria-label]="'FACTURATION.PANEL_MODE_TOOLTIP' | translate"
      ></i>
    </label>
    <p-select
      [inputId]="modeId()"
      [options]="modeOptions()"
      [ngModel]="pMode()"
      (ngModelChange)="pMode.set($event)"
      optionLabel="label"
      optionValue="value"
      styleClass="pf-select"
    />
  </div>

  <div class="pf-field">
    <label class="pf-label" [attr.for]="dateId()">{{ 'FACTURATION.PANEL_DATE' | translate }}<span class="pf-required" aria-hidden="true">*</span></label>
    <p-datepicker
      [inputId]="dateId()"
      [ngModel]="pDate()"
      (ngModelChange)="pDate.set($event)"
      dateFormat="dd/mm/yy"
      appendTo="body"
    />
  </div>

  <div class="pf-field pf-field--ref">
    <label class="pf-label pf-label--help" [attr.for]="refId()">
      {{ 'FACTURATION.PANEL_REF' | translate }}
      @if (refRequired()) { <span class="pf-required" aria-hidden="true">*</span> }
      <i aria-hidden="true"
        class="pi pi-info-circle pf-help"
        [appTooltip]="'FACTURATION.PANEL_REF_TOOLTIP' | translate"
        tabindex="0"
        [attr.aria-label]="'FACTURATION.PANEL_REF_TOOLTIP' | translate"
      ></i>
    </label>
    <input
      [id]="refId()"
      type="text"
      pInputText
      class="pf-input"
      autocomplete="off"
      [required]="refRequired()"
      [attr.aria-required]="refRequired()"
      [ngModel]="pRef()"
      (ngModelChange)="pRef.set($event)"
    />
  </div>
</div>

<button
  class="paiement-form__submit"
  type="button"
  [disabled]="!formValid() || submitting()"
  [attr.aria-busy]="submitting()"
  (click)="submit()"
>
  @if (submitting()) {
    <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
  }
  {{ confirmLabel() }}
</button>
