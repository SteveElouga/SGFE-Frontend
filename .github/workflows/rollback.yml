name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Tag de l'image à restaurer (ex: sha-abc1234). Laisser vide pour revenir à latest."
        required: false
        default: latest
      reason:
        description: "Raison du rollback"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sgfe-frontend

jobs:
  rollback:
    name: Rollback → ${{ inputs.image-tag }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.ENV_CANARY || 'production-canary' }}
      url: https://aquabill.cm

    steps:
      - name: Log rollback
        run: |
          echo "🔄 Rollback demandé par ${{ github.actor }}"
          echo "   Tag cible : ${{ inputs.image-tag }}"
          echo "   Raison    : ${{ inputs.reason }}"

      # CICD-SEC-5 (PBAC) : image-tag est un input workflow_dispatch en texte
      # libre, jusqu'ici recopié tel quel dans le script SSH ci-dessous — la
      # substitution ${{ }} de GitHub Actions est un remplacement de texte
      # brut dans le YAML, pas un passage de variable échappé. Un tag malformé
      # (guillemet, `;`, `$(...)`) s'y serait injecté comme du vrai shell sur
      # l'hôte de production. On referme la porte ici, avant l'étape SSH.
      - name: Valider le format du tag (défense contre une injection via workflow_dispatch)
        run: |
          set -euo pipefail
          tag="${{ inputs.image-tag }}"
          if ! [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::image-tag invalide : \"$tag\" — seuls les caractères valides d'un tag Docker sont acceptés (alphanumériques, '.', '_', '-', 128 caractères max, jamais en premier). Refusé avant d'atteindre le script SSH." >&2
            exit 1
          fi

      # `github.repository_owner` porte la casse réelle du compte GitHub
      # (« SteveElouga »), mais un nom de dépôt OCI/GHCR doit être entièrement
      # en minuscules — `TARGET` ci-dessous est recomposé à la main à partir
      # de `env.IMAGE_NAME` et échouerait sinon (voir cd-staging.yml, même
      # correctif, trouvé en vérifiant ce déploiement en conditions réelles).
      - name: Nom d'image en minuscules (GHCR rejette toute casse majuscule)
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Rollback via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # IMAGE_TAG transite en variable d'environnement réelle de la session
          # SSH distante (envs ci-dessous), pas en texte recopié dans le script
          # — même après validation, une variable reste la bonne pratique :
          # elle ne peut jamais être re-interprétée comme du YAML/shell au
          # moment où ce fichier est composé.
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/aquabill/production

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Restaurer l'image stable demandée
            TARGET="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:$IMAGE_TAG"
            docker pull $TARGET
            STABLE_IMAGE=$TARGET docker compose -f docker-compose.prod.yml up -d --no-deps frontend-stable

            # Arrêter le canary si actif et remettre nginx à 100% stable
            docker compose -f docker-compose.prod.yml stop frontend-canary 2>/dev/null || true
            export CANARY_WEIGHT=0
            export STABLE_WEIGHT=100
            envsubst < /opt/aquabill/nginx/nginx-lb.conf.tpl > /etc/nginx/conf.d/lb.conf
            nginx -s reload

            sleep 10
            curl -sf http://localhost/health || exit 1
            echo "✅ Rollback OK → $TARGET"
